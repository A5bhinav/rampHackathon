openapi: 3.1.0
info:
  title: Dialback dashboard API (dashboard to core)
  version: 0.1.0
  description: |
    What the dashboard (apps/web) reads from and sends to the core service (apps/core).
    Owner: Abhi. Spec: specs/0002-skeleton-integration.md, D9 and D12.

    - Every request carries the signed-in user's JWT. The core verifies it and runs the
      request in Postgres as that user (`set local role authenticated` plus the JWT claims),
      so `auth.uid()` is the person and row-level security applies. A release reaches
      `app.release_case()` under the approver's own identity (ADR-9).
    - The dashboard never decides who may act. `permissions` in a case detail is a hint for
      the UI; the database refuses the changer, the reviewer and a stale version anyway.
    - Every sentence that explains a decision (`summary`, `explanation`, `reasons`) comes from
      a template in the core, never from a model, and says "provable" or "not provable",
      never "safe".
    - Times are RFC 3339 UTC. For lab datasets, event times are the dataset's simulated time.

servers:
  - url: http://localhost:8001
    description: Core service (local)

security:
  - userJwt: []

paths:
  /api/me:
    get:
      operationId: getMe
      summary: The signed-in user and their roles
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
              example:
                user_id: a9b8c7d6-e5f4-4321-8abc-def012345678
                display_name: Riley Approver
                roles: [approver]
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /api/datasets:
    get:
      operationId: listDatasets
      summary: Datasets that are not retired, newest first
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [datasets]
                properties:
                  datasets:
                    type: array
                    items: { $ref: '#/components/schemas/Dataset' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /api/datasets/{dataset_id}/chain:
    get:
      operationId: getChainStatus
      summary: Recompute the dataset's evidence chain (the "chain intact" badge)
      parameters:
        - $ref: '#/components/parameters/DatasetId'
      responses:
        '200':
          description: OK, whether or not the chain is intact
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChainStatus' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/datasets/{dataset_id}/evidence:
    get:
      operationId: getEvidenceLog
      summary: The dataset's evidence chain, row by row, with the live check and the last scheduled check (spec 0035)
      description: >-
        Every row's hashes, newest first, and two checks Postgres runs on each row: whether its
        content hash still matches its body, and whether it links to the row before. The chain
        status is audit.verify_chain, recomputed now. The page decides nothing.
      parameters:
        - $ref: '#/components/parameters/DatasetId'
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000, default: 500 }
      responses:
        '200':
          description: OK, whether or not the chain is intact
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceLog' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/datasets/{dataset_id}/alerts:
    get:
      operationId: listOpenAlerts
      summary: Unresolved alerts for a dataset, critical first
      parameters:
        - $ref: '#/components/parameters/DatasetId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [alerts]
                properties:
                  alerts:
                    type: array
                    items: { $ref: '#/components/schemas/Alert' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/datasets/{dataset_id}/vendor-risk:
    get:
      operationId: getVendorRisk
      summary: The vendor risk list (spec 0026) - is each vendor's number on file one the Trust Ledger can prove?
      description: |
        One row per vendor with ledger documents, worst first (needs_person, near_miss, unproven,
        missing, provable), then by name. The status is decided by code from the selection rule
        (`select()`, spec 0021 and spec 0079) run as of now; `status_text` is the ledger's sentence
        for it, so the dashboard writes none of its own.
      parameters:
        - $ref: '#/components/parameters/DatasetId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [vendors]
                properties:
                  vendors:
                    type: array
                    items: { $ref: '#/components/schemas/VendorRisk' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/datasets/{dataset_id}/vendor-accounts:
    get:
      operationId: listVendorAccounts
      summary: Each vendor's current bank account, for the demo's Ramp (mock) portal (spec 0077)
      description: |
        Every vendor on the dataset with its current account as Dialback stores it (routing number
        and last four only, ADR-8) and its open case, if any. `can_change` says whether the signed-in
        person can send a bank change from the dashboard: only on the current demo dataset, against
        the Ramp mock, for a person linked to a Ramp user. When it is false, `reason` is the core's
        sentence for why.
      parameters:
        - $ref: '#/components/parameters/DatasetId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorAccounts' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/datasets/{dataset_id}/mail:
    get:
      operationId: listMail
      summary: The mail Dialback received for this dataset, newest first (email door)
      description: |
        One row per stored inbound email, newest first, at most 200. A row says what Dialback did
        with the email (`outcome`), whether a reply went out (`reply`), the red flags it noticed,
        and the vendor and case it led to, if any. The routing number and last four are shown when
        the email gave a new account; a full account number never appears (ADR-8). The email body
        is never returned.
      parameters:
        - $ref: '#/components/parameters/DatasetId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 200
                    items: { $ref: '#/components/schemas/MailItem' }
              example:
                items:
                  - id: 2
                    received_at: '2026-11-10T15:04:05Z'
                    sender: ar@acme-supply.example
                    subject: Updated remittance details
                    flagged: false
                    outcome: no_vendor
                    reply: not_flagged
                    red_flags: []
                    vendor: null
                    case_id: null
                    routing_number: null
                    last4: null
                  - id: 1
                    received_at: '2026-11-10T14:58:41Z'
                    sender: billing@acme-suppIy.example   # deliberate lookalike (a capital I for the l): keep it, it shows lookalike_domain
                    subject: Our bank account has changed
                    flagged: true
                    outcome: case_opened
                    reply: sent
                    red_flags: [lookalike_domain, reply_to_differs]
                    vendor: { id: 3f6a9d2e-8b14-4c7a-a5e0-1d2c3b4a5f60, legal_name: Acme Supply Co }
                    case_id: 7b1e4c2a-5d3f-4a8e-9c61-2f0d8b7a4e15
                    routing_number: '026009593'
                    last4: '0001'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/datasets/{dataset_id}/vendors/{vendor_id}/bank-change:
    post:
      operationId: changeVendorBankAccount
      summary: A clerk changes a vendor's bank details in the Ramp mock, as their linked Ramp user (demo only, spec 0077)
      description: |
        Demo datasets only, with `DIALBACK_RAMP=mock`. The core forwards the change to the Ramp
        mock as the signed-in person's linked Ramp user, then asks the mock to deliver its webhooks.
        Dialback then detects the change the way it detects any change in Ramp, and the person who
        sent it is the change's author, so they can't release it (R5). The full account number passes
        through to the mock and is never stored, logged or returned (ADR-8). A refusal sends nothing
        to Ramp. Only a clerk can send a change, and a dataset takes at most one change a minute (409),
        so a shared demo account can't set off a run of holds and calls.
      parameters:
        - $ref: '#/components/parameters/DatasetId'
        - name: vendor_id
          in: path
          required: true
          schema: { $ref: '../schemas/evidence-event.schema.json#/$defs/Uuid' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BankChangeRequest' }
            example: { routing_number: '026009593', account_number: '000123450001' }
      responses:
        '202':
          description: Sent to Ramp; Dialback will detect it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankChangeResult' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
        '502':
          description: |
            The Ramp mock refused the change, could not be reached, or did not confirm it. The message
            says which: only a refusal or an unreachable mock means nothing was changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: upstream_unavailable, message: The Ramp mock could not be reached. Nothing was changed; try again. }

  /api/cases:
    get:
      operationId: listCases
      summary: The case queue
      parameters:
        - name: dataset_id
          in: query
          required: true
          schema: { $ref: '../schemas/evidence-event.schema.json#/$defs/Uuid' }
        - name: state
          in: query
          required: false
          description: Filter by state. Repeat the parameter for several states. Default is every unfinished state.
          schema:
            type: array
            items: { $ref: '../schemas/evidence-event.schema.json#/$defs/CaseState' }
          style: form
          explode: true
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        '200':
          description: Unfinished cases by state and age, oldest first
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [cases]
                properties:
                  cases:
                    type: array
                    items: { $ref: '#/components/schemas/CaseSummary' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/InvalidRequest' }

  /api/cases/{case_id}:
    get:
      operationId: getCase
      summary: Everything the case detail page and the release console show
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/cases/{case_id}/selection:
    get:
      operationId: getCaseSelection
      summary: The number lineage panel - the selection the case used, and why (spec 0023)
      description: |
        The selection named by the case's latest `number_resolved` or `no_provable_number`
        event, as `ledger.number_selections` stores it (`selection.schema.json`), read under the
        person's own token. `selection` is null when the case has no selection yet, or its event
        names none that the ledger stored. `reason_text` gives the ledger's template sentence for
        each reason code, and `notes` its sentences for the panel's other states; the dashboard
        shows these and never writes its own.
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SelectionView' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/cases/{case_id}/release:
    post:
      operationId: releaseCase
      summary: Approve or reject the release of a verified case (four-eyes, in SQL)
      description: |
        Calls `app.release_case()` as the signed-in user. When the changer is unknown, the
        first approval returns `awaiting_second_approver` and a different approver releases.
      parameters:
        - $ref: '#/components/parameters/CaseId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReleaseRequest' }
            example:
              expected_version: 1
              action: approve
              reason: Vendor's AR manager confirmed on the contract number; last four match.
      responses:
        '200':
          description: Applied, or the same request was already applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionResult' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidRequest' }

  /api/cases/{case_id}/review:
    post:
      operationId: reviewCase
      summary: Clear or block a case that is in needs_review
      description: |
        Clearing sends the case to awaiting_release, where a different person must still
        approve the release. The person who entered the change cannot clear it.
      parameters:
        - $ref: '#/components/parameters/CaseId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewRequest' }
            example:
              expected_version: 2
              action: clear
              reason: Reached the vendor's CFO on the number from the 2023 contract; confirmed the change.
      responses:
        '200':
          description: Applied, or the same request was already applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionResult' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidRequest' }

  /api/people:
    get:
      operationId: listPeople
      summary: Everyone in the organisation, with their roles (admins only, spec 0095)
      description: |
        Reads `app.admin_people()` as the signed-in user. Anyone without the admin role, a demo
        account, or an admin whose access is off gets 403.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/People' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/people/{user_id}/roles:
    post:
      operationId: changeRole
      summary: Grant or take away one role (admins only)
      description: |
        Calls `app.admin_set_role()`. Refused (409) when it changes nothing, when it would remove
        the last admin, or when it grants admin to a demo account. Logged on the organisation chain.
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleChange' }
            example: { role: approver, grant: true, reason: Riley covers releases while the controller is out this week. }
      responses:
        '200':
          description: Applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonAdminView' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidRequest' }

  /api/people/{user_id}/ramp-link:
    post:
      operationId: changeRampLink
      summary: Set or clear which Ramp user this person is (admins only)
      description: |
        Calls `app.admin_set_ramp_link()`. An admin cannot change their own link, and a Ramp user
        can be linked to one person only (R5). Who entered a change is fixed when the change is
        detected, so a new link never changes an open case.
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RampLinkChange' }
            example: { ramp_user_id: 7c1d2e3f-0000-4000-8000-00000000c1e7, reason: Sam enters vendor changes in Ramp. }
      responses:
        '200':
          description: Applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonAdminView' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidRequest' }

  /api/people/{user_id}/access:
    post:
      operationId: changeAccess
      summary: Turn a person's access off or back on (admins only)
      description: |
        Calls `app.admin_set_access()`. A person whose access is off gets 403 on every request;
        their roles are kept. An admin cannot turn off their own access or the last admin's.
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccessChange' }
            example: { enabled: false, reason: Left the company on Nov 10. }
      responses:
        '200':
          description: Applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonAdminView' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidRequest' }

  /api/admin/log:
    get:
      operationId: getAdminLog
      summary: The organisation chain of admin actions, newest first, and whether it verifies (admins only)
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminLog' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/demo:
    get:
      operationId: getDemoState
      summary: The current demo dataset, its cases, chain, open alerts and chaos switch (admins only)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DemoState' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/admin/demo/reset:
    post:
      operationId: resetDemo
      summary: Make a fresh demo dataset; with a clerk chosen, also load the Trust Ledger and Acme's request email (admins only)
      description: |
        Runs `demo prepare` when `link_clerk_user_id` is given, else `demo reset` (spec 0011,
        spec 0077). The team phone is never accepted here; it stays a shell option.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DemoResetRequest' }
            example: { link_clerk_user_id: c1d2e3f4-a5b6-4c7d-8e9f-0a1b2c3d4e5f, reason: Fresh demo before the judges' run. }
      responses:
        '200':
          description: Applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DemoState' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidRequest' }

  /api/admin/demo/chaos:
    post:
      operationId: setDemoChaos
      summary: Turn spec 0008's chaos mode on or off for the current demo (admins only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DemoChaosRequest' }
            example: { enabled: true, reason: Show that a failed hold keeps the payment stopped. }
      responses:
        '200':
          description: Applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DemoState' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidRequest' }

  /api/admin/demo/tamper:
    post:
      operationId: tamperDemo
      summary: Rewrite one row of the current demo's evidence chain, to show the chain catching it (admins only)
      description: |
        Acts only on the current demo dataset. Needs the typed confirmation `break the chain`;
        it cannot be undone.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DemoTamperRequest' }
            example: { confirm: break the chain, reason: Showing the judges that a rewritten row breaks the chain. }
      responses:
        '200':
          description: Applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DemoState' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidRequest' }

components:
  securitySchemes:
    userJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The signed-in user's Supabase access token (a dev token in local development).

  parameters:
    DatasetId:
      name: dataset_id
      in: path
      required: true
      schema: { $ref: '../schemas/evidence-event.schema.json#/$defs/Uuid' }
    CaseId:
      name: case_id
      in: path
      required: true
      schema: { $ref: '../schemas/evidence-event.schema.json#/$defs/Uuid' }
    UserId:
      name: user_id
      in: path
      required: true
      schema: { $ref: '../schemas/evidence-event.schema.json#/$defs/Uuid' }

  responses:
    Unauthenticated:
      description: Missing, expired or invalid token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: The rules refuse this person (for example the changer, the reviewer, or a missing role)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: forbidden, message: The person who entered the change cannot release it (R5). }
    NotFound:
      description: No such dataset or case
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: The case changed since the page loaded (version_conflict), or it is not in a state that allows this (transition_refused)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: version_conflict, message: This case changed since you loaded it. Reload to see version 2. }
    InvalidRequest:
      description: Malformed request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Uuid:
      $ref: '../schemas/evidence-event.schema.json#/$defs/Uuid'
    Timestamp:
      type: string
      format: date-time

    Role:
      type: string
      description: An admin also holds every power of the other three roles; R5 still applies (spec 0095).
      enum: [clerk, approver, auditor, admin]

    Me:
      type: object
      additionalProperties: false
      required: [user_id, display_name, roles]
      properties:
        user_id: { $ref: '#/components/schemas/Uuid' }
        display_name: { type: string }
        roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }

    Person:
      description: A Dialback user, shown by name.
      type: object
      additionalProperties: false
      required: [id, display_name]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        display_name: { type: string }

    Dataset:
      type: object
      additionalProperties: false
      required: [id, kind, label, chain_id, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, enum: [dev, demo, lab] }
        label: { type: string }
        chain_id: { $ref: '#/components/schemas/Uuid' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        sim_now:
          description: Lab datasets only; the dataset's simulated time.
          oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }]

    ChainStatus:
      type: object
      additionalProperties: false
      required: [chain_id, ok, checked, first_bad_seq, detail, tip_seq, tip_hash]
      properties:
        chain_id: { $ref: '#/components/schemas/Uuid' }
        ok: { type: boolean }
        checked: { type: integer, minimum: 0, description: Events verified before the first break, or all of them. }
        first_bad_seq:
          oneOf: [{ type: integer, minimum: 1 }, { type: 'null' }]
        detail: { type: string, description: '"chain intact", or why the first bad row fails.' }
        tip_seq:
          oneOf: [{ type: integer, minimum: 1 }, { type: 'null' }]
        tip_hash:
          oneOf: [{ $ref: '../schemas/evidence-event.schema.json#/$defs/Sha256Hex' }, { type: 'null' }]
      example:
        chain_id: 0f3b7f2e-4d2a-4b1e-9c3d-1a2b3c4d5e6f
        ok: false
        checked: 6
        first_bad_seq: 7
        detail: content_hash does not match body_jcs (body edited)
        tip_seq: 12
        tip_hash: 9b74c9897bac770ffc029102a200c5de3ce2d1b9b1b0d6c1a2e3f4a5b6c7d8e9

    Alert:
      type: object
      additionalProperties: false
      required: [id, kind, severity, message, raised_at, case_id]
      properties:
        id: { type: integer }
        case_id:
          oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
        kind:
          type: string
          description: hold_not_confirmed, vendor_not_held, chain_broken, command_stuck, bad_webhook_signature, no_provable_number, deadline_reached, not_verified
        severity: { type: string, enum: [info, warning, critical] }
        message: { type: string }
        raised_at: { $ref: '#/components/schemas/Timestamp' }

    HoldStatus:
      type: string
      enum: [placing, confirmed, failed, releasing, released]

    CaseSummary:
      description: One row of the case queue.
      type: object
      additionalProperties: false
      required: [id, dataset_id, vendor, state, outcome, version, opened_at, updated_at, deadline_at, hold_status, bills_held, next_payment_date, unknown_changer]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        dataset_id: { $ref: '#/components/schemas/Uuid' }
        vendor:
          type: object
          additionalProperties: false
          required: [id, legal_name]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            legal_name: { type: string }
        state: { $ref: '../schemas/evidence-event.schema.json#/$defs/CaseState' }
        outcome:
          oneOf: [{ $ref: '../schemas/evidence-event.schema.json#/$defs/Outcome' }, { type: 'null' }]
        version: { type: integer, minimum: 1, description: The change generation. Send it back as expected_version. }
        opened_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
        deadline_at:
          oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }]
        hold_status:
          oneOf: [{ $ref: '#/components/schemas/HoldStatus' }, { type: 'null' }]
        bills_held: { type: integer, minimum: 0, description: Unpaid bills in the saved schedule. }
        next_payment_date:
          description: Earliest saved payment date among held bills, so bills near their due date stand out.
          oneOf: [{ $ref: '../schemas/evidence-event.schema.json#/$defs/IsoDate' }, { type: 'null' }]
        unknown_changer: { type: boolean, description: True when release needs two approvers (ADR-10). }

    AccountRef:
      description: A bank account as Dialback stores it. Never the full number (ADR-8).
      type: object
      additionalProperties: false
      required: [routing_number, last4]
      properties:
        routing_number: { type: string }
        last4: { type: string, pattern: '^[0-9]{4}$' }

    MailOutcome:
      description: >-
        What Dialback did with one inbound email. `pending` until it has been handled. `ramp_case_open`:
        the vendor's unfinished case has a change that did not come by email, so the email changed nothing
        (its `case_id` names that case).
      type: string
      enum: [pending, not_flagged, door_off, not_demo_vendor, no_vendor, several_vendors, no_routing_number, no_account_number, same_as_on_file, repeat_request, case_opened, joined_case, ramp_case_open, failed]

    ReplyStatus:
      description: Whether the reply to the sender went out, and if not, why.
      type: string
      enum: [not_flagged, sent, not_configured, unauthenticated, suppressed, rate_limited, failed]

    RedFlag:
      description: A reason an email looks like fraud. Decided by code, never by a model.
      type: string
      enum: [lookalike_domain, sender_off_domain, reply_to_differs, sender_unauthenticated, unknown_phone]

    EmailInfo:
      description: The email that started a case. Never its body.
      type: object
      additionalProperties: false
      required: [sender, subject, received_at, red_flags]
      properties:
        sender: { type: string }
        subject: { type: [string, 'null'] }
        received_at: { $ref: '#/components/schemas/Timestamp' }
        red_flags:
          type: array
          items: { $ref: '#/components/schemas/RedFlag' }

    MailItem:
      description: One inbound email and what Dialback did with it. No body field, ever.
      type: object
      additionalProperties: false
      required: [id, received_at, sender, subject, flagged, outcome, reply, red_flags, vendor, case_id, routing_number, last4]
      properties:
        id: { type: integer }
        received_at: { $ref: '#/components/schemas/Timestamp' }
        sender: { type: string }
        subject: { type: [string, 'null'] }
        flagged: { type: boolean, description: Whether the email asks to change bank details. }
        outcome: { $ref: '#/components/schemas/MailOutcome' }
        reply: { $ref: '#/components/schemas/ReplyStatus' }
        red_flags:
          type: array
          items: { $ref: '#/components/schemas/RedFlag' }
        vendor:
          oneOf:
            - type: object
              additionalProperties: false
              required: [id, legal_name]
              properties:
                id: { $ref: '#/components/schemas/Uuid' }
                legal_name: { type: string }
            - type: 'null'
        case_id:
          oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
        routing_number: { type: [string, 'null'] }
        last4:
          oneOf: [{ type: string, pattern: '^[0-9]{4}$' }, { type: 'null' }]

    ChangeInfo:
      type: object
      additionalProperties: false
      required: [detected_via, detected_at, old_account, new_account, changed_by, unknown_changer]
      properties:
        detected_via: { type: string, enum: [webhook, poll, email] }
        detected_at: { $ref: '#/components/schemas/Timestamp' }
        old_account:
          oneOf: [{ $ref: '#/components/schemas/AccountRef' }, { type: 'null' }]
        new_account: { $ref: '#/components/schemas/AccountRef' }
        changed_by:
          oneOf: [{ $ref: '#/components/schemas/Person' }, { type: 'null' }]
        unknown_changer: { type: boolean }
        email:
          description: For a case an email opened (`detected_via` email), the email; otherwise absent or null. Optional.
          oneOf: [{ $ref: '#/components/schemas/EmailInfo' }, { type: 'null' }]

    HoldInfo:
      type: object
      additionalProperties: false
      required: [status, ramp_ref, placed_at, confirmed_at, released_at, schedule, last_error]
      properties:
        status: { $ref: '#/components/schemas/HoldStatus' }
        ramp_ref: { type: [string, 'null'] }
        placed_at:
          oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }]
        confirmed_at:
          oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }]
        released_at:
          oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }]
        schedule:
          type: array
          items: { $ref: '../schemas/evidence-event.schema.json#/$defs/ScheduleEntry' }
        last_error: { type: [string, 'null'] }

    DecisionInfo:
      type: object
      additionalProperties: false
      required: [outcome, rules_fired, engine_version, last_four_result, decided_at, explanation]
      properties:
        outcome: { $ref: '../schemas/evidence-event.schema.json#/$defs/Outcome' }
        rules_fired:
          type: array
          items: { type: string }
        engine_version: { type: string }
        last_four_result:
          oneOf: [{ $ref: '../schemas/evidence-event.schema.json#/$defs/LastFourResult' }, { type: 'null' }]
        decided_at: { $ref: '#/components/schemas/Timestamp' }
        explanation:
          description: One templated sentence per rule that fired.
          type: array
          items: { type: string }
        fired:
          description: >-
            The rules that fired, each with its sentence and the block of the rule table it
            belongs to, in the order the engine recorded them (spec 0035). Optional: older cores
            don't send it.
          type: array
          items: { $ref: '#/components/schemas/FiredRule' }
        checklist:
          description: >-
            The Verified conditions (V01 to V12, and S01 in strict mode), each passed, not met or
            not checked, read from the rules the engine recorded; the core never re-runs them.
            Not checked means an earlier block decided first. Optional.
          type: array
          items: { $ref: '#/components/schemas/ChecklistItem' }
        checklist_note:
          description: A templated sentence saying why the checklist reads as it does. Optional.
          type: string
        effect:
          description: A templated sentence saying what the outcome does to the hold and who acts next. Optional.
          type: string

    FiredRule:
      type: object
      additionalProperties: false
      required: [id, sentence, block]
      properties:
        id: { type: string }
        sentence: { type: string }
        block:
          type: string
          enum: [input, not_verified, needs_review, verified, not_met, engine, retired]

    ChecklistItem:
      type: object
      additionalProperties: false
      required: [id, sentence, status]
      properties:
        id: { type: string, description: 'The condition, e.g. V08_digits_match.' }
        sentence:
          type: string
          description: The condition's sentence when it holds, or its unmet sentence when it doesn't.
        status: { type: string, enum: [passed, not_met, not_checked] }

    CallAnswerView:
      description: >-
        One answer the callee gave, as code recorded it. For account_last4 there is never a digit:
        value is null with digit_count, or dont_know / refused (ADR-8).
      type: object
      additionalProperties: false
      required: [slot, value, digit_count, turn_id, capture_method, captured_at, feeds]
      properties:
        slot: { $ref: '../schemas/call-answers.schema.json#/$defs/Slot' }
        value:
          oneOf: [{ type: string }, { type: 'null' }]
        digit_count:
          oneOf: [{ type: integer, minimum: 1, maximum: 4 }, { type: 'null' }]
        turn_id: { type: integer, minimum: 0, description: The transcript turn the answer cites. }
        capture_method: { type: string, enum: [speech, keypad] }
        captured_at: { type: string }
        feeds:
          description: The decision rules that read this answer.
          type: array
          items: { type: string }

    CallAttempt:
      description: >-
        One call, from its call_started and call_ended evidence and, when the voice service
        stored it, voice.calls. No transcript is kept; the answers cite the turn they came from.
      type: object
      additionalProperties: false
      required: [call_id, attempt, started_at, ended_at, result, reason, answered_by, direction, dialed_number_is_pick,
                 provider, agent_version, last_four_result, answers, checks]
      properties:
        call_id: { $ref: '#/components/schemas/Uuid' }
        attempt: { type: integer, minimum: 1 }
        started_at:
          oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }]
        ended_at:
          oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }]
        result:
          description: Null while the call is still running.
          oneOf:
            - type: string
              enum: [answers_recorded, no_answer, voicemail, busy, failed, machine, declined, callback_requested, timed_out]
            - type: 'null'
        reason:
          description: A templated sentence for how the call ended, or the voice service's reason code.
          oneOf: [{ type: string }, { type: 'null' }]
        answered_by:
          oneOf: [{ type: string, enum: [human, machine] }, { type: 'null' }]
        direction:
          oneOf: [{ type: string, enum: [outbound, inbound] }, { type: 'null' }]
        dialed_number_is_pick:
          oneOf: [{ type: boolean }, { type: 'null' }]
        provider:
          oneOf: [{ type: string }, { type: 'null' }]
        agent_version:
          oneOf: [{ type: string }, { type: 'null' }]
        last_four_result:
          oneOf: [{ $ref: '../schemas/evidence-event.schema.json#/$defs/LastFourResult' }, { type: 'null' }]
        answers:
          type: array
          items: { $ref: '#/components/schemas/CallAnswerView' }
        checks:
          oneOf: [{ $ref: '../schemas/evidence-event.schema.json#/$defs/CallChecks' }, { type: 'null' }]

    CallScript:
      description: >-
        The call's fixed text from the call policy, with the customer's name and callback number
        left as labels. The agent words each question itself; the disclosure is always word for word.
      type: object
      additionalProperties: false
      required: [disclosure, questions, note]
      properties:
        disclosure: { type: string }
        questions:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [slot, wording]
            properties:
              slot: { type: string }
              wording: { type: string }
        note: { type: string, description: A templated sentence on what is and isn't kept from a call. }

    EvidenceRow:
      type: object
      additionalProperties: false
      required: [seq, type, case_id, vendor, occurred_at, actor_kind, prev_hash, content_hash, hash, content_ok, link_ok]
      properties:
        seq: { type: integer, minimum: 1 }
        type: { type: string }
        case_id:
          oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
        vendor:
          description: The case's vendor's legal name, when the row belongs to a case.
          oneOf: [{ type: string }, { type: 'null' }]
        occurred_at: { $ref: '#/components/schemas/Timestamp' }
        actor_kind: { type: string, enum: [system, person] }
        prev_hash: { $ref: '../schemas/evidence-event.schema.json#/$defs/Sha256Hex' }
        content_hash: { $ref: '../schemas/evidence-event.schema.json#/$defs/Sha256Hex' }
        hash: { $ref: '../schemas/evidence-event.schema.json#/$defs/Sha256Hex' }
        content_ok: { type: boolean, description: 'Postgres recomputed the content hash from the stored body, and it matches.' }
        link_ok:
          type: boolean
          description: The row's prev_hash is the previous row's hash and its hash is sha256(prev_hash + content_hash).

    EvidenceLog:
      type: object
      additionalProperties: false
      required: [chain, last_check, events, total]
      properties:
        chain: { $ref: '#/components/schemas/ChainStatus' }
        last_check:
          description: >-
            What the scheduled verify job found on its last run on this dataset, or null if it
            hasn't run. It also compares the tip with the one its previous run saw, so it can find
            deleted or rewritten newest rows that a recompute alone can't.
          oneOf:
            - type: object
              additionalProperties: false
              required: [finished_at, ok]
              properties:
                finished_at:
                  oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }]
                ok:
                  description: Whether that run found the chain intact; null if it recorded no result.
                  oneOf: [{ type: boolean }, { type: 'null' }]
                first_bad_seq:
                  oneOf: [{ type: integer, minimum: 1 }, { type: 'null' }]
                detail:
                  oneOf: [{ type: string }, { type: 'null' }]
            - type: 'null'
        total: { type: integer, minimum: 0 }
        events:
          description: Newest first, at most limit rows.
          type: array
          items: { $ref: '#/components/schemas/EvidenceRow' }

    ReleaseRecord:
      type: object
      additionalProperties: false
      required: [actor, action, reason, case_version, created_at]
      properties:
        actor: { $ref: '#/components/schemas/Person' }
        action: { type: string, enum: [approve, reject] }
        reason: { type: string }
        case_version: { type: integer, minimum: 1 }
        created_at: { $ref: '#/components/schemas/Timestamp' }

    TimelineEntry:
      description: One evidence event, as the case detail timeline shows it.
      type: object
      additionalProperties: false
      required: [seq, type, occurred_at, actor, from_state, to_state, version, summary, hash]
      properties:
        seq: { type: integer, minimum: 1 }
        type: { $ref: '../schemas/evidence-event.schema.json#/$defs/EventType' }
        occurred_at: { $ref: '#/components/schemas/Timestamp' }
        actor:
          type: object
          additionalProperties: false
          required: [kind, id, display_name]
          properties:
            kind: { type: string, enum: [system, person] }
            id:
              oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
            display_name: { type: string, description: '"Dialback" for the system.' }
        from_state:
          oneOf: [{ $ref: '../schemas/evidence-event.schema.json#/$defs/CaseState' }, { type: 'null' }]
        to_state: { $ref: '../schemas/evidence-event.schema.json#/$defs/CaseState' }
        version: { type: integer, minimum: 1 }
        summary: { type: string, description: A templated sentence. }
        hash: { $ref: '../schemas/evidence-event.schema.json#/$defs/Sha256Hex' }

    Permissions:
      description: What the signed-in user may do right now. A hint for the UI; SQL decides.
      type: object
      additionalProperties: false
      required: [can_approve, can_reject, can_review, reasons]
      properties:
        can_approve: { type: boolean }
        can_reject: { type: boolean }
        can_review: { type: boolean }
        can_dismiss: { type: boolean, description: Whether the signed-in user may dismiss this case. Optional. }
        reasons:
          description: Why an action is not offered, one templated sentence each.
          type: array
          items: { type: string }

    CaseDetail:
      type: object
      additionalProperties: false
      required: [case, change, hold, decision, releases, timeline, chain, permissions, entered_by, reviewed_by]
      properties:
        case: { $ref: '#/components/schemas/CaseSummary' }
        entered_by:
          oneOf: [{ $ref: '#/components/schemas/Person' }, { type: 'null' }]
        reviewed_by:
          oneOf: [{ $ref: '#/components/schemas/Person' }, { type: 'null' }]
        change: { $ref: '#/components/schemas/ChangeInfo' }
        hold:
          oneOf: [{ $ref: '#/components/schemas/HoldInfo' }, { type: 'null' }]
        decision:
          description: The latest decision for the current version, or null.
          oneOf: [{ $ref: '#/components/schemas/DecisionInfo' }, { type: 'null' }]
        releases:
          type: array
          items: { $ref: '#/components/schemas/ReleaseRecord' }
        timeline:
          type: array
          items: { $ref: '#/components/schemas/TimelineEntry' }
        chain: { $ref: '#/components/schemas/ChainStatus' }
        permissions: { $ref: '#/components/schemas/Permissions' }
        calls:
          description: Every call placed for this case, oldest first (spec 0035). Optional.
          type: array
          items: { $ref: '#/components/schemas/CallAttempt' }
        call_script:
          description: The call's fixed text (spec 0035). Optional.
          $ref: '#/components/schemas/CallScript'

    ReleaseRequest:
      type: object
      additionalProperties: false
      required: [expected_version, action, reason]
      properties:
        expected_version: { type: integer, minimum: 1, description: The case version the person saw. }
        action: { type: string, enum: [approve, reject] }
        reason: { type: string, minLength: 1, maxLength: 2000 }

    ReviewRequest:
      type: object
      additionalProperties: false
      required: [expected_version, action, reason]
      properties:
        expected_version: { type: integer, minimum: 1 }
        action: { type: string, enum: [clear, block] }
        reason: { type: string, minLength: 1, maxLength: 2000 }

    ActionResult:
      type: object
      additionalProperties: false
      required: [status, case_id, from_state, to_state, version]
      properties:
        status: { type: string, enum: [applied, already_applied, awaiting_second_approver] }
        case_id: { $ref: '#/components/schemas/Uuid' }
        from_state:
          oneOf: [{ $ref: '../schemas/evidence-event.schema.json#/$defs/CaseState' }, { type: 'null' }]
        to_state: { $ref: '../schemas/evidence-event.schema.json#/$defs/CaseState' }
        version: { type: integer, minimum: 1 }
        evidence_seq: { type: [integer, 'null'] }

    SelectionView:
      type: object
      additionalProperties: false
      required: [selection, reason_text, notes]
      properties:
        selection:
          description: The stored selection document, or null when there is none yet.
          oneOf: [{ $ref: '../schemas/selection.schema.json' }, { type: 'null' }]
        reason_text:
          type: object
          description: The ledger's sentence for each reason code a candidate can carry.
          additionalProperties: false
          required: [first_seen_in_change_context, too_few_source_types, younger_than_minimum_age, near_miss_of_older_number, hidden_text_only, not_vendor_party, fax_line]
          properties:
            first_seen_in_change_context: { type: string }
            too_few_source_types: { type: string }
            younger_than_minimum_age: { type: string }
            near_miss_of_older_number: { type: string }
            hidden_text_only: { type: string }
            not_vendor_party: { type: string }
            fax_line: { type: string }
        notes:
          type: object
          description: The ledger's sentences for the panel's other states, so the dashboard writes none of its own.
          additionalProperties: false
          required: [no_selection, no_provable_number, alternates]
          properties:
            no_selection: { type: string, description: 'When `selection` is null: what that means for the case.' }
            no_provable_number: { type: string, description: 'Under a no_provable_number selection: what happens next.' }
            alternates: { type: string, description: 'Beside the alternates: when they are used.' }

    VendorRisk:
      type: object
      additionalProperties: false
      required: [vendor_id, legal_name, status, number_on_file, provable_number, status_text]
      properties:
        vendor_id: { $ref: '../schemas/evidence-event.schema.json#/$defs/Uuid' }
        legal_name: { type: string }
        status:
          type: string
          enum: [needs_person, near_miss, unproven, missing, provable]
          description: needs_person - the rule withholds (spec 0079) because documents it treats as change context, such as a message from a lookalike domain, would change which number is called, so a person must verify; provable - the number on file meets the rule; near_miss - it is a near miss of a number the rule can prove; unproven - the rule can't prove it; missing - no number on file.
        number_on_file:
          description: What the old vendor master says, in E.164, or null.
          oneOf: [{ type: string, pattern: '^\+[1-9][0-9]{1,14}$' }, { type: 'null' }]
        provable_number:
          description: The number the selection rule would call today, in E.164, or null when it would call no one (no provable number, or needs_person).
          oneOf: [{ type: string, pattern: '^\+[1-9][0-9]{1,14}$' }, { type: 'null' }]
        status_text: { type: string, description: "The ledger's sentence for the status." }

    VendorAccount:
      type: object
      additionalProperties: false
      required: [vendor_id, legal_name, account, open_case_id]
      properties:
        vendor_id: { $ref: '../schemas/evidence-event.schema.json#/$defs/Uuid' }
        legal_name: { type: string }
        account:
          description: The vendor's current account as Dialback last saw it in Ramp, or null if none.
          oneOf: [{ $ref: '#/components/schemas/AccountRef' }, { type: 'null' }]
        open_case_id:
          description: The vendor's unfinished case, if one is open.
          oneOf: [{ $ref: '../schemas/evidence-event.schema.json#/$defs/Uuid' }, { type: 'null' }]

    VendorAccounts:
      type: object
      additionalProperties: false
      required: [vendors, can_change, reason]
      properties:
        vendors:
          type: array
          items: { $ref: '#/components/schemas/VendorAccount' }
        can_change: { type: boolean, description: Whether the signed-in person can send a bank change from the dashboard here. }
        reason:
          description: When can_change is false, the core's sentence for why; otherwise null.
          oneOf: [{ type: string }, { type: 'null' }]

    BankChangeRequest:
      type: object
      additionalProperties: false
      required: [routing_number, account_number]
      properties:
        routing_number: { type: string, maxLength: 64, description: Nine digits with a valid ABA checksum. }
        account_number: { type: string, maxLength: 64, description: 4 to 17 digits. Forwarded to the Ramp mock; never stored, logged or returned. }

    BankChangeResult:
      type: object
      additionalProperties: false
      required: [vendor_id, account]
      properties:
        vendor_id: { $ref: '../schemas/evidence-event.schema.json#/$defs/Uuid' }
        account: { $ref: '#/components/schemas/AccountRef' }

    PersonAdminView:
      description: One person as an admin sees them (spec 0095).
      type: object
      additionalProperties: false
      required: [id, display_name, email, roles, ramp_user_id, demo_only, access_enabled, last_sign_in_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        display_name: { type: string }
        email: { type: [string, 'null'] }
        roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }
        ramp_user_id: { type: [string, 'null'], description: The Ramp user this person is; null when not linked. }
        demo_only: { type: boolean, description: A shared demo account (spec 0034); acts on demo data only and never holds admin. }
        access_enabled: { type: boolean }
        last_sign_in_at:
          oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }]

    People:
      type: object
      additionalProperties: false
      required: [people]
      properties:
        people:
          type: array
          items: { $ref: '#/components/schemas/PersonAdminView' }

    RoleChange:
      type: object
      additionalProperties: false
      required: [role, grant, reason]
      properties:
        role: { $ref: '#/components/schemas/Role' }
        grant: { type: boolean, description: true grants the role, false takes it away. }
        reason: { type: string, minLength: 1, maxLength: 2000 }

    RampLinkChange:
      type: object
      additionalProperties: false
      required: [ramp_user_id, reason]
      properties:
        ramp_user_id: { type: [string, 'null'], minLength: 1, maxLength: 200, pattern: '\S', description: null clears the link; blank is refused. }
        reason: { type: string, minLength: 1, maxLength: 2000 }

    AccessChange:
      type: object
      additionalProperties: false
      required: [enabled, reason]
      properties:
        enabled: { type: boolean }
        reason: { type: string, minLength: 1, maxLength: 2000 }

    AdminLogEntry:
      type: object
      additionalProperties: false
      required: [seq, type, occurred_at, actor, subject, detail, reason]
      properties:
        seq: { type: integer, minimum: 1 }
        type: { $ref: '../schemas/admin-event.schema.json#/$defs/AdminEventType' }
        occurred_at: { $ref: '#/components/schemas/Timestamp' }
        actor:
          oneOf: [{ $ref: '#/components/schemas/Person' }, { type: 'null' }]
          description: null when the team granted it with scripts/db/add_user.py.
        subject:
          oneOf: [{ $ref: '#/components/schemas/Person' }, { type: 'null' }]
        detail: { type: object }
        reason: { type: string }

    AdminLog:
      type: object
      additionalProperties: false
      required: [chain, events]
      properties:
        chain: { $ref: '#/components/schemas/ChainStatus' }
        events:
          type: array
          items: { $ref: '#/components/schemas/AdminLogEntry' }

    DemoState:
      description: What `dialback-core demo status` prints, for the current demo dataset.
      type: object
      additionalProperties: false
      required: [dataset, cases, chain, alerts, chaos, warnings]
      properties:
        dataset:
          type: object
          additionalProperties: false
          required: [id, label, created_at]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            label: { type: string }
            created_at: { $ref: '#/components/schemas/Timestamp' }
        cases:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, vendor, state, outcome]
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              vendor: { type: string }
              state: { $ref: '../schemas/evidence-event.schema.json#/$defs/CaseState' }
              outcome:
                oneOf: [{ $ref: '../schemas/evidence-event.schema.json#/$defs/Outcome' }, { type: 'null' }]
        chain:
          type: object
          additionalProperties: false
          required: [ok, checked, first_bad_seq, detail]
          properties:
            ok: { type: boolean }
            checked: { type: integer, minimum: 0 }
            first_bad_seq:
              oneOf: [{ type: integer, minimum: 1 }, { type: 'null' }]
            detail: { type: string }
        alerts:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kind, severity, message]
            properties:
              kind: { type: string }
              severity: { type: string }
              message: { type: string }
        chaos: { type: boolean }
        warnings:
          type: array
          items: { type: string }
          description: What the last reset warned about, for example a seeded user left unlinked (each release then needs two approvers). Empty otherwise.

    DemoResetRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        link_clerk_user_id:
          oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
          description: The account the seed's clerk becomes; with one, the Trust Ledger and Acme's request email load too.
        reason: { type: string, minLength: 1, maxLength: 2000 }

    DemoChaosRequest:
      type: object
      additionalProperties: false
      required: [enabled, reason]
      properties:
        enabled: { type: boolean }
        reason: { type: string, minLength: 1, maxLength: 2000 }

    DemoTamperRequest:
      type: object
      additionalProperties: false
      required: [confirm, reason]
      properties:
        confirm: { const: break the chain }
        reason: { type: string, minLength: 1, maxLength: 2000 }

    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [unauthenticated, forbidden, not_found, version_conflict, transition_refused, invalid_request, upstream_unavailable]
        message: { type: string }
