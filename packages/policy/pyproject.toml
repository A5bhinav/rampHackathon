[project]
name = "dialback-policy"
version = "0.1.0"
description = "policy.step(), the call script, the four record-only tools and the speech guard. Pure: no I/O."
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "jsonschema>=4.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dialback_policy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
