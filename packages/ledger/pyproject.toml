[project]
name = "dialback-ledger"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = ["rfc8785>=0.1", "phonenumbers>=8.13", "psycopg[binary]>=3.2", "anthropic>=2.7.0",
                "pdfplumber>=0.11", "pypdfium2>=4.30", "numpy>=2", "pytesseract>=0.3.13"]   # spec 0092: real PDFs

[project.scripts]
dialback-ledger = "dialback_ledger.demo:main"

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "jsonschema>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dialback_ledger"]

[tool.pytest.ini_options]
# Tests that take `database_url` get a migrated Postgres (scripts/db/pgtemp.py); the rest need none.
pythonpath = ["../../scripts/db"]
addopts = "-p pgtemp"
