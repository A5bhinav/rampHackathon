[project]
name = "dialback-evals"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
  "dialback-policy",
  "dialback-voice",
  "dialback-decision",
  "pyyaml>=6",
]

[project.scripts]
lab = "dialback_evals.cli:main"

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dialback_evals"]
