# Spec 0048, A5: the person answers the company question with no name ("The company": nothing is left
# once legal words are dropped), so production's company match is unknown.
# Spec 0082, D7b (Sami, Nov 10): an unknown company answer no longer blocks (V05 is retired), and a legit
# caller whose company answer names nothing is expected to verify (`unclear`). So this scenario now guards
# the other side: it fails (did_not_verify) if the company answer is ever required again. Before D7b it
# expected V05_company_matches_unmet, a rule that can no longer fire.
id: l22-legit-company-unclear
class: legit_odd_contact
is_attack: false
customer_name: Northwind Traders
vendor_name: Acme Fasteners
caller:
  consent: 'yes'
  company: The company
  company_is: unclear
  department: Accounts payable
  name: Jordan Lee
  role: AP clerk
  change: 'yes'
  last4_mode: keypad
  last4: '4821'
  answered_by: human
facts:
  dialed_eligible_number: true
  new_last4: "4821"
  dialed_number_is_pick: true
  speaker_in_change_thread: false
  offered_number_from_request: false
