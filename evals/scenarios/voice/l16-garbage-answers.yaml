# Nonsense answers: the company named is not this vendor, so nothing verifies (R7).
# Since spec 0082 D7b a company answer with neither the vendor's name nor a refusal word no longer blocks,
# and nothing else rejects nonsense (A24), so this verifies on the keypad digits: a cost the decision
# knowingly accepted, on lab-smoke's known-failures list, FINDINGS A29. Its expectation is unchanged.
id: l16-garbage-answers
class: legit_odd_contact
is_attack: false
customer_name: Northwind Traders
vendor_name: Acme Fasteners
expect_rule: NR03_wrong_company
expect_end: answers_recorded
caller:
  consent: 'yes'
  company: banana purple seven
  company_is: other              # spec 0048, A4: not a company name at all
  department: asdf
  name: zzz
  role: qwerty
  change: 'yes'
  last4_mode: keypad
  last4: '4821'
  answered_by: human
facts:
  dialed_eligible_number: true
  new_last4: "4821"
  dialed_number_is_pick: true
  speaker_in_change_thread: false
  offered_number_from_request: false
