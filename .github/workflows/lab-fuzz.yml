name: lab-fuzz

# The attack lab's generative gate on the number-selection rule (spec 0083). It re-runs every frozen
# finding in evals/corpus-generated, then runs spec 0046's search that keeps going over the whole 2000
# generated worlds at a pinned seed (so a known failure cannot mask a new one, FINDINGS B3), and fails
# on any frozen case that still fails or any new finding, except what its strict known-failures list
# holds (evals/known-failures.json, spec 0048 D3): the findings frozen there stay listed while select()
# has them, and the fix belongs in packages/ledger, not here.
on:
  pull_request:
    paths:
      - "packages/ledger/**"
      - "evals/**"
      - ".github/workflows/lab-fuzz.yml"
  push:
    branches: [main]

jobs:
  lab-fuzz:
    name: attack lab, selection fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install the Python workspace
        run: uv sync --all-packages --locked
      - name: Lab checks that must stay green (L1 floor, oracle self-tests, coverage floor)
        run: cd evals && uv run pytest -q -m "not selection_gate"
      - name: Lab fuzz (frozen findings, then all 2000 worlds at seed 0, near misses reported, never gated)
        if: always()
        run: uv run lab fuzz --search archive --examples 2000 --seed 0 --out evals/corpus-generated
      - name: Keep the findings for a local repro
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lab-fuzz-findings
          path: evals/corpus-generated
