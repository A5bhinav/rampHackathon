name: demo-smoke

on:
  pull_request:
  push:
    branches: [main]

jobs:
  demo-smoke:
    name: one case end to end on the real services
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - run: uv sync --all-packages --locked
      - name: Smoke run (Ramp mock and core as real services, scripted doubles for the ledger and voice)
        run: uv run python scripts/dev/stack.py --smoke
        timeout-minutes: 5
