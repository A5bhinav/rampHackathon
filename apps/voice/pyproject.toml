[project]
name = "dialback-voice"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
  "dialback-policy",
  "fastapi>=0.115",
  "httpx>=0.28",
  "pydantic>=2.9",
  "psycopg[binary]>=3.2",
  "uvicorn[standard]>=0.30",  # [standard] brings websockets: ConversationRelay is a WebSocket (spec 0034, B4)
  "tzdata>=2024.1",
]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "pyyaml>=6", "jsonschema>=4.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dialback_voice"]

[project.scripts]
dialback-voice = "dialback_voice.entrypoint:main"
